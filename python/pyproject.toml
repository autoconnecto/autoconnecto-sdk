[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoconnecto"
version = "1.7.101"
description = "Autoconnecto IoT client for Linux SBCs (Raspberry Pi, Orange Pi, Rockchip, BeagleBone, Debian gateways) — MQTT, HTTPS, and GPIO (gpiozero), same contract as the ESP32 Arduino SDK."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Autoconnecto" }]
keywords = ["iot", "mqtt", "autoconnecto", "raspberry-pi", "gpio", "gateway", "sbc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
]
dependencies = [
  "paho-mqtt>=2.0.0,<3",
  "requests>=2.28.0,<3",
]

[project.optional-dependencies]
gpio = ["gpiozero>=2.0"]
dotenv = ["python-dotenv>=1.0"]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://www.autoconnecto.in"
Documentation = "https://docs.autoconnecto.in/guide/linux-sbc-quickstart.html"
Repository = "https://github.com/autoconnecto/autoconnecto-sdk"
"ESP32 Arduino SDK" = "https://github.com/autoconnecto/autoconnecto-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoconnecto = ["isrg_roots.pem"]
